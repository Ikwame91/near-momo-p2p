[package]
name = "openramp-escrow"
version = "0.1.0"
edition = "2021"
description = "OpenRamp escrow: holds USDC, LP bonds and orders; releases only on an OutLayer PAID verdict"
repository = "https://github.com/Ikwame91/near-momo-p2p"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }

# Reproducible build (cargo near build reproducible-wasm): same image for everyone, so the
# deployed wasm hash can be checked against this source. Image digest from Docker Hub
# (sourcescan/cargo-near, tag 0.22.0-rust-1.97.0, matches rust-toolchain.toml).
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.97.0"
image_digest = "sha256:b193c8640a27172f83136a0f0aab2a9bf9d09f6ba0e6afd187addfaa9b92bae0"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]
