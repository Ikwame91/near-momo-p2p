[package]
name = "openramp-verifier"
version = "0.1.0"
edition = "2021"
description = "OpenRamp OutLayer program: verify / fingerprint / checkout against Paystack test mode (SPEC §3.1, §4)"
repository = "https://github.com/Ikwame91/near-momo-p2p"

[lib]
path = "src/lib.rs"

[[bin]]
name = "openramp-verifier"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasi-http-client = "0.2"

[profile.release]
opt-level = "z"
lto = true
strip = true
