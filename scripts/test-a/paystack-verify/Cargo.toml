[package]
name = "paystack-verify"
version = "0.1.0"
edition = "2021"
description = "Test A part 3 (M0.5): OutLayer program that checks a Paystack payment and returns PAID / NOT_PAID / UNVERIFIABLE"

[lib]
path = "src/lib.rs"

[[bin]]
name = "paystack-verify"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasi-http-client = "0.2"

[profile.release]
opt-level = "z"
lto = true
strip = true
